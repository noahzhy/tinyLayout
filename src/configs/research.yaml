# Design defaults only. Full dataset trainer and graph decoder are TODO.
model:
  dim: 128
  heads: 4
  layers: 2
  bev_h: 16
  bev_w: 16
  patch_h: 7
  patch_w: 7
  identity_dim: 256
  memory_dim: 12
  semantic_classes: 4
  ema_decay: 0.996
  dropout: 0.0
runtime:
  seed: 17
  batch_size: 2
  image_size: 224
  context_frames: 4
  teacher_frames: 8
  memory_tokens: 64
  learning_rate: 0.0001
  num_threads: 1
# 4 semantic classes are a smoke convention, not the final annotation taxonomy.
